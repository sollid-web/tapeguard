name: Worker, signer and circuit

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Worker + guard circuit
        run: npm test
      - name: Signer Worker
        working-directory: signer
        run: npm ci && npm test
